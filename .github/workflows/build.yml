name: Build APK from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Project
        run: |
          unzip Offline_games_duel_Android_Project.zip -d project
          find project -name gradlew

      - name: Build APK
        run: |
          cd project
          PROJECT_DIR=$(find . -name gradlew -type f | head -n 1 | xargs dirname)
          echo "Project ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
